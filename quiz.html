<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Quiz de Autoevaluación</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/quiz.css">
</head>

<body>
  <div class="quiz-container">

    <header class="quiz-header">
      <h2 id="quizTitle"></h2>
      <span id="progress" class="progress-text"></span>
    </header>

    <section class="question-card">
      <h3 id="question"></h3>

      <img id="questionImage" />
      <button id="toggleImg" style="display:none;">👁 Ver imagen</button>
    </section>

    <section id="options" class="options-list"></section>

    <div class="feedback" id="feedback"></div>

    <button id="nextBtn" disabled>
      Siguiente →
    </button>
  </div>

  <script type="module" src="./js/quiz.js"></script>

</body>
</html>
